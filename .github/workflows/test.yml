name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev libmupdf-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Setup go-fitz symlinks
        run: |
          ln -s "$(go list -m -f '{{.Dir}}' github.com/gen2brain/go-fitz)/include" go-fitz-include
          ln -s "$(go list -m -f '{{.Dir}}' github.com/gen2brain/go-fitz)/libs" go-fitz-libs

      # main.go embeds frontend/dist; the Go tests don't need a real frontend build.
      - name: Create frontend/dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.keep

      - name: Run Go tests
        run: go test -tags gtk3 -v ./...

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test