name: Windows Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Windows amd64 build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        # Populates frontend/dist so //go:embed all:frontend/dist has assets.
        shell: bash
        working-directory: frontend
        run: npm run build

      - name: Setup MSVC environment
        # MuPDF static libs shipped by gen2brain/go-fitz are built with MSVC,
        # so cgo must use cl.exe to satisfy MSVC-only intrinsics like
        # __intrinsic_setjmpex / __memcpy_chk.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Download Go dependencies
        run: go mod download

      - name: Setup go-fitz directories
        shell: bash
        run: |
          FITZ=$(go list -m -f '{{.Dir}}' github.com/gen2brain/go-fitz)
          cp -r "$FITZ/include" go-fitz-include
          cp -r "$FITZ/libs"    go-fitz-libs

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I${{ github.workspace }}/go-fitz-include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/go-fitz-libs -lmupdf_windows_amd64 -lmupdfthird_windows_amd64"
        run: go build -tags production -ldflags "-H windowsgui" -o lankir.exe .

      - name: Verify artifact
        shell: bash
        run: |
          test -f lankir.exe
          file lankir.exe || true
          ls -lh lankir.exe

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lankir-windows-amd64
          path: lankir.exe
          retention-days: 14
